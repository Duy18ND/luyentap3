spring.application.name=luyentap

# K?t n?i MySQL v?i ??y ?? tham s? Unicode
spring.datasource.url=jdbc:mysql://localhost:3306/luyentap?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H? tr? hi?n th? d? li?u LAZY
spring.jpa.open-in-view=true

# T?ng gi?i h?n upload file (Tránh l?i 413 Payload Too Large)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
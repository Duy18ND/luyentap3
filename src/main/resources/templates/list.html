<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách Nhân Viên</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Danh Sách Nhân Viên</h3>
            <a th:href="@{/add}" class="btn btn-light font-weight-bold">
                <i class="fas fa-plus-circle"></i> Thêm Nhân Viên
            </a>
        </div>

        <div class="card-body bg-light border-bottom">
            <form th:action="@{/list}" method="get">
                <input type="hidden" name="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDir" th:value="${sortDir}">
                <div class="row">
                    <div class="col-md-3 mb-2">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tên nhân viên...">
                    </div>
                    <div class="col-md-3 mb-2">
                        <select name="deptId" class="form-control">
                            <option value="">-- Tất cả phòng ban --</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}" th:selected="${d.id == deptId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2 mb-2">
                        <input type="number" name="minAge" th:value="${minAge}" class="form-control" placeholder="Từ tuổi...">
                    </div>
                    <div class="col-md-2 mb-2">
                        <input type="number" name="maxAge" th:value="${maxAge}" class="form-control" placeholder="Đến tuổi...">
                    </div>
                    <div class="col-md-2 mb-2 d-flex">
                        <button type="submit" class="btn btn-primary w-100 mr-1"><i class="fas fa-search"></i> Lọc</button>
                        <a th:href="@{/list}" class="btn btn-secondary w-100" title="Xóa tìm kiếm"><i class="fas fa-times"></i> Hủy</a>
                    </div>
                </div>
            </form>
        </div>

        <div class="card-body">
            <table class="table table-bordered table-hover text-center">
                <thead class="thead-light">
                <tr>
                    <th>STT</th>
                    <th>Avatar</th>
                    <th>
                        <a th:href="@{/list(page=${currentPage}, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'}, keyword=${keyword}, deptId=${deptId}, minAge=${minAge}, maxAge=${maxAge})}" class="text-dark">
                            Họ và Tên
                            <i th:if="${sortField == 'name'}" class="fas" th:classappend="${sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down'}"></i>
                            <i th:unless="${sortField == 'name'}" class="fas fa-sort text-muted"></i>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/list(page=${currentPage}, sortField='age', sortDir=${sortField == 'age' ? reverseSortDir : 'asc'}, keyword=${keyword}, deptId=${deptId}, minAge=${minAge}, maxAge=${maxAge})}" class="text-dark">
                            Tuổi
                            <i th:if="${sortField == 'age'}" class="fas" th:classappend="${sortDir == 'asc' ? 'fa-sort-up' : 'fa-sort-down'}"></i>
                            <i th:unless="${sortField == 'age'}" class="fas fa-sort text-muted"></i>
                        </a>
                    </th>
                    <th>Phòng Ban</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="emp, stat : ${employees}">
                    <td th:text="${stat.count + (currentPage - 1) * 5}"></td>
                    <td>
                        <img th:src="@{'/uploads/' + ${emp.avatar}}"
                             alt="Avatar"
                             style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 1px solid #ddd;"
                             onerror="this.src='https://via.placeholder.com/50'">
                    </td>
                    <td class="font-weight-bold" th:text="${emp.name}"></td>
                    <td th:text="${emp.age}"></td>
                    <td>
                        <span class="badge badge-info" th:text="${emp.department != null ? emp.department.name : 'N/A'}"></span>
                    </td>
                    <td>
                        <span th:class="${emp.status == 'Đang làm việc' ? 'badge badge-success' : 'badge badge-warning'}"
                              th:text="${emp.status}"></span>
                    </td>
                    <td>
                        <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa nhân viên này?')">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr th:if="${totalItems == 0}">
                    <td colspan="7" class="text-muted py-4">
                        <i class="fas fa-info-circle mb-2"></i><br>
                        Không tìm thấy nhân viên nào phù hợp.
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
                <span class="text-muted">Tổng số: <b th:text="${totalItems}"></b> nhân viên</span>
                <nav>
                    <ul class="pagination mb-0">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/list(page=${currentPage - 1}, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword}, deptId=${deptId}, minAge=${minAge}, maxAge=${maxAge})}">Previous</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link" th:href="@{/list(page=${i}, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword}, deptId=${deptId}, minAge=${minAge}, maxAge=${maxAge})}" th:text="${i}"></a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/list(page=${currentPage + 1}, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword}, deptId=${deptId}, minAge=${minAge}, maxAge=${maxAge})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
